<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gate Install</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("Inter-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: Inter;
      src: url("Inter-Medium.ttf") format("truetype");
      font-weight: 500;
    }
    @font-face {
      font-family: Inter;
      src: url("Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Inter, "Segoe UI", sans-serif;
      color: #fff;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .splash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }
    .splash img {
      width: min(78vw, 520px);
      height: auto;
      opacity: 0;
    }
    .stage.show-splash .splash img { opacity: 1; }
    .stage.launcher-up .splash img {
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    .window {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 728px;
      transform: translate(-50%, -50%) scale(0.98);
      transform-origin: center center;
      opacity: 0;
      pointer-events: none;
      background: #0b1020 url("studio-logo.png") center / 100% 100% no-repeat;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.45);
    }
    .stage.launcher-up .window {
      opacity: 1;
      transform: translate(-50%, -50%) scale(var(--fit, 1));
      pointer-events: auto;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .logo {
      position: absolute;
      top: 10px;
      left: 50%;
      height: 52px;
      width: auto;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .mark { display: none; }
    .drag {
      position: absolute;
      left: 0;
      top: 0;
      right: 72px;
      height: 42px;
    }
    .win-btn {
      position: absolute;
      top: 8px;
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: #dcdde2;
      cursor: pointer;
      padding: 0;
    }
    .win-btn.min { right: 36px; }
    .win-btn.close { right: 8px; }
    .win-btn svg { display: block; margin: 0 auto; }
    .install {
      position: absolute;
      left: 54px;
      top: 582px;
      width: 312px;
      height: 68px;
      border: 0;
      border-radius: 3px;
      background: #2ebcbe;
      color: #0a101c;
      font: 600 22px/1 Inter, "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
    }
    .install:hover { background: #46d0d2; }
    .advanced, .back {
      position: absolute;
      left: 0;
      right: 0;
      top: 662px;
      border: 0;
      background: transparent;
      color: #e4e6ea;
      font: 500 11px/1 Inter, "Segoe UI", sans-serif;
      letter-spacing: 0.18em;
      text-align: center;
      cursor: pointer;
    }
    .advanced:hover, .back:hover { color: #fff; }
    .caption {
      position: absolute;
      right: 14px;
      bottom: 10px;
      color: #949aa6;
      font: 400 10px/1 Inter, "Segoe UI", sans-serif;
      pointer-events: none;
    }
    .panel {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 548px;
      bottom: 0;
      background: rgba(10, 12, 18, 0.94);
      text-align: center;
    }
    .window.advanced-open .install,
    .window.advanced-open .advanced { display: none; }
    .window.advanced-open .panel { display: block; }
    .panel h2 {
      margin: 28px 0 16px;
      font: 600 15px/1 Inter, sans-serif;
      font-weight: 600;
    }
    .path {
      width: 336px;
      height: 36px;
      margin: 0 auto;
      border-radius: 3px;
      background: #1c202a;
      color: #babec6;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font: 400 13px/1 Inter, sans-serif;
      text-align: left;
    }
    .back { top: 128px; position: relative; display: block; width: 100%; }
    .replay {
      position: absolute;
      left: 16px;
      bottom: 14px;
      z-index: 3;
      border: 0;
      background: transparent;
      color: #666;
      font: 13px Inter, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .window.minimized {
      height: 36px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="splash">
      <img src="wordmark.png" alt="ObsiFox Studio">
    </div>
    <section class="window" id="window" aria-label="Gate Install">
      <img class="logo" src="wordmark.png" alt="ObsiFox Studio">
      <img class="mark" src="mark.png" alt="">
      <div class="drag" id="drag"></div>
      <button class="win-btn min" id="min" type="button" aria-label="Minimize">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M2 7.5h10" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button class="win-btn close" id="close" type="button" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M3 3l8 8M11 3L3 11" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button class="install" type="button">Install</button>
      <button class="advanced" id="advanced" type="button">ADVANCED OPTIONS</button>
      <div class="panel" id="panel">
        <h2>Install location</h2>
        <div class="path">Choose a folder</div>
        <button class="back" id="back" type="button">BACK</button>
      </div>
      <div class="caption">Gate Install</div>
    </section>
    <button class="replay" id="replay" type="button">Replay</button>
  </div>
  <script>
    const stage = document.getElementById("stage");
    const win = document.getElementById("window");
    const LOGO_MS = 6000;
    let timer = 0;

    function fit() {
      const scale = Math.min(1, (window.innerWidth - 32) / 420, (window.innerHeight - 32) / 728);
      win.style.setProperty("--fit", String(scale));
    }

    function play() {
      clearTimeout(timer);
      win.classList.remove("advanced-open", "minimized");
      stage.classList.remove("show-splash", "launcher-up");
      fit();
      requestAnimationFrame(() => stage.classList.add("show-splash"));
      timer = setTimeout(() => stage.classList.add("launcher-up"), LOGO_MS);
    }

    document.getElementById("advanced").addEventListener("click", () => {
      win.classList.add("advanced-open");
    });
    document.getElementById("back").addEventListener("click", () => {
      win.classList.remove("advanced-open");
    });
    document.getElementById("close").addEventListener("click", () => {
      stage.classList.remove("launcher-up");
    });
    document.getElementById("min").addEventListener("click", () => {
      win.classList.toggle("minimized");
    });
    document.getElementById("replay").addEventListener("click", play);
    window.addEventListener("resize", fit);
    play();
  </script>
</body>
</html>

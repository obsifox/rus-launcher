[package]
name = "rus-launcher"
version = "0.4.0"
edition = "2021"
description = "Rus Launcher. A Minecraft launcher by Obsifox Studio."
publish = false

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
include_dir = "0.7"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

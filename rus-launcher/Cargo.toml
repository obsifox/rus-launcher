[package]
name = "rus-launcher"
version = "0.4.1"
edition = "2021"
description = "Rus Launcher. A Minecraft launcher by Obsifox Studio."
publish = false

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
include_dir = "0.7"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
md-5 = "0.10"
rsa = { version = "0.9", features = ["pem", "getrandom"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rus Launcher</title>
  <style>
    @font-face { font-family: Inter; src: url("fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: Inter; src: url("fonts/Inter-Medium.ttf") format("truetype"); font-weight: 500; }
    @font-face { font-family: Inter; src: url("fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070708; color: #f4f5f7; font-family: Inter, "Segoe UI", sans-serif; }
    button, input { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { height: 100%; display: flex; flex-direction: column; background: #101114; }
    .titlebar {
      height: 36px; flex: none; display: flex; align-items: center;
      padding: 0 8px 0 14px; background: #0c0c0e; color: #c8c9ce; font: 400 12px/1 Inter, sans-serif;
    }
    .titlebar .grow { flex: 1; }
    .win { width: 36px; height: 28px; border: 0; background: transparent; color: #d5d6db; }
    .win:hover { background: #2a2a2e; }
    .win.close:hover { background: #e23b45; color: #fff; }
    .body { flex: 1; min-height: 0; display: flex; }
    .rail {
      width: 76px; flex: none; background: #0c0c0e;
      display: flex; flex-direction: column; align-items: center;
      padding: 14px 0 12px; gap: 6px;
    }
    .brand { width: 32px; height: 32px; margin-bottom: 10px; }
    .rail button.tab {
      width: 64px; height: 58px; border: 0; border-radius: 4px; background: transparent;
      color: #9b9ca3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font: 500 9px/1 Inter, sans-serif; letter-spacing: 0.04em;
    }
    .rail button.tab svg { display: block; }
    .rail button.tab:hover { background: #1a1a1e; color: #fff; }
    .rail button.tab.active { background: #1c1c20; color: #fff; box-shadow: inset 3px 0 0 #e23b45; }
    .rail .foot { margin-top: auto; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #141416; }
    .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    .hero { position: relative; height: 46%; min-height: 260px; flex: none; overflow: hidden; background: #111; }
    .hero .art, .side-art { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
    .hero .art { position: absolute; inset: 0; }
    .hero .shade {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(8,8,10,.88) 0%, rgba(8,8,10,.5) 36%, rgba(8,8,10,.05) 68%);
    }
    .hero .copy { position: absolute; left: 36px; bottom: 28px; right: 36%; z-index: 1; }
    .kicker { margin: 0 0 10px; color: #ff4d57; font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.16em; }
    h1 { margin: 0; font: 600 40px/1.05 Inter, sans-serif; letter-spacing: -0.03em; }
    .lede { margin: 10px 0 0; max-width: 460px; color: #d7d8de; font: 400 14px/1.45 Inter, sans-serif; }
    .play, .save {
      margin-top: 18px; height: 38px; padding: 0 18px; border: 0; border-radius: 2px;
      background: #e23b45; color: #fff; font: 600 13px/1 Inter, sans-serif; letter-spacing: 0.06em;
    }
    .play:hover, .save:hover { background: #ff4d57; }
    .feed {
      flex: none; display: grid; grid-template-columns: 1.15fr 1fr 1fr 0.9fr;
      grid-auto-rows: 292px; gap: 14px; padding: 16px 18px 18px;
    }
    .card, .game {
      background: #1b1b1f; border: 0; border-radius: 4px; overflow: hidden; text-align: left;
      color: #f4f5f7; min-width: 0;
    }
    .card { display: flex; flex-direction: column; height: 292px; }
    .card:hover, .game:hover { background: #222228; }
    .card .thumb { height: 156px; width: 100%; object-fit: cover; object-position: center 40%; flex: none; }
    .card .pad { padding: 12px 14px 14px; }
    .tag, .more { color: #ff4d57; font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.14em; }
    .card h2 { margin: 8px 0 0; font: 600 15px/1.25 Inter, sans-serif; }
    .card p { margin: 6px 0 0; color: #9b9ca3; font: 400 12px/1.4 Inter, sans-serif; }
    .more { display: inline-block; margin-top: 12px; font-size: 11px; }
    .game { position: relative; height: 292px; padding: 0; }
    .game img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .game .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.72)); }
    .game .label { position: absolute; left: 14px; right: 14px; bottom: 14px; text-align: left; }
    .game strong { display: block; font: 600 14px/1.2 Inter, sans-serif; }
    .game span { color: #ffb4b8; font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.12em; }

    .page { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 340px; }
    .form { min-height: 0; overflow: auto; padding: 22px 28px 28px; }
    .form h1 { font-size: 28px; }
    .note { margin: 8px 0 18px; color: #9b9ca3; font-size: 13px; }
    .label {
      margin: 18px 0 10px; color: #9b9ca3; font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.16em;
    }
    .label:first-of-type { margin-top: 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip, .loader {
      height: 32px; padding: 0 12px; border-radius: 2px; border: 1px solid #2c2c32;
      background: #1b1b1f; color: #d7d8de; font: 500 13px/1 Inter, sans-serif;
    }
    .chip.active, .loader.active { border-color: #e23b45; color: #fff; box-shadow: inset 0 0 0 1px #e23b45; }
    .versions {
      display: flex; gap: 8px; overflow: auto; padding-bottom: 6px;
    }
    .versions::-webkit-scrollbar { height: 8px; }
    .versions::-webkit-scrollbar-thumb { background: #2c2c32; }
    .ver {
      width: 84px; flex: none; border: 1px solid #2c2c32; background: #1b1b1f; border-radius: 4px;
      padding: 8px 4px 10px; color: #f4f5f7; text-align: center;
    }
    .ver img { width: 48px; height: 48px; object-fit: contain; }
    .ver b { display: block; margin-top: 4px; font: 600 11px/1 Inter, sans-serif; }
    .ver.active { border-color: #e23b45; box-shadow: inset 0 0 0 1px #e23b45; }
    .actions {
      display: flex; align-items: stretch; width: fit-content; margin: 16px 0 18px;
      background: #1b1b1f; border-radius: 2px; overflow: hidden;
    }
    .actions button {
      height: 36px; padding: 0 16px; border: 0; background: transparent; color: #fff;
      font: 600 13px/1 Inter, sans-serif; letter-spacing: 0.04em;
    }
    .actions button:hover { background: #2a2a30; }
    .actions .rule { width: 1px; background: #3a3a42; }
    .ltabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .ltabs button {
      padding: 0; border: 0; background: transparent; line-height: 0; cursor: pointer;
      opacity: 0.62; filter: saturate(0.6) brightness(0.88);
      border-bottom: 2px solid transparent; transition: opacity 0.15s, filter 0.15s;
    }
    .ltabs button:hover { opacity: 0.9; filter: saturate(0.9) brightness(1); }
    .ltabs button.active { opacity: 1; filter: none; border-bottom-color: #e23b45; }
    .ltabs img { display: block; width: 150px; height: 45px; object-fit: cover; }
    .ltabs .plate {
      display: flex; align-items: center; justify-content: center;
      width: 150px; height: 45px; box-sizing: border-box;
      background: linear-gradient(180deg, #2b2b32 0%, #191920 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d8d9de; font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .import-box { display: none; gap: 8px; margin-top: 10px; }
    .import-box.open { display: flex; }
    .import-box input {
      height: 36px; flex: 1; border: 0; border-radius: 2px; background: #1b1b1f; padding: 0 12px; font-size: 13px; outline: none;
    }
    .import-box button {
      height: 36px; padding: 0 14px; border: 0; border-radius: 2px; background: #e23b45; color: #fff;
      font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.06em;
    }
    .badge { color: #9b9ca3; font: 500 11px/1 Inter, sans-serif; letter-spacing: 0.08em; }
    .subtabs { display: flex; gap: 8px; margin: 16px 0 12px; }
    .subtabs button {
      height: 32px; padding: 0 14px; border: 0; border-radius: 2px;
      background: #1b1b1f; color: #9b9ca3; font: 600 13px/1 Inter, sans-serif;
    }
    .subtabs button.active { background: #e23b45; color: #fff; }
    .cards { display: flex; flex-wrap: wrap; gap: 10px; }
    .vcard {
      position: relative; width: 156px; height: 104px; padding: 0; cursor: pointer;
      border: 1px solid #2c2c32; border-radius: 4px; overflow: hidden; background: #141419;
    }
    .vcard .art {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0.9; transition: opacity 0.15s;
    }
    .vcard .scrim {
      position: absolute; left: 0; right: 0; top: 0; height: 48px;
      background: linear-gradient(180deg, rgba(44, 29, 91, 0.97) 0%, rgba(44, 29, 91, 0.78) 46%, rgba(44, 29, 91, 0) 100%);
    }
    .vcard .head {
      position: absolute; left: 8px; right: 8px; top: 9px;
      display: flex; align-items: center; gap: 6px;
    }
    .vcard .head img { width: 15px; height: 15px; object-fit: contain; flex: none; }
    .vcard .head b { font: 600 12px/1 Inter, sans-serif; color: #fff; }
    .vcard .head i {
      font: 500 9px/1 Inter, sans-serif; font-style: normal; letter-spacing: 0.08em;
      text-transform: uppercase; color: #bcb8cf;
    }
    .vcard .head img.tag {
      width: 46px; height: 14px; margin-left: auto; object-fit: cover;
      border-radius: 2px; display: block; opacity: 0.96;
    }
    .vcard:hover { border-color: #4a4a55; }
    .vcard:hover .art { opacity: 1; }
    .vcard.active { border-color: #e23b45; box-shadow: inset 0 0 0 1px #e23b45; }
    .mini-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .mini {
      width: 68px; border: 1px solid #2c2c32; background: #1b1b1f; border-radius: 4px;
      padding: 6px 2px 8px; text-align: center; color: #fff;
    }
    .mini img { width: 32px; height: 32px; object-fit: contain; }
    .mini b { display: block; margin-top: 4px; font: 600 11px/1 Inter, sans-serif; }
    .mini em { display: block; margin-top: 3px; font: 400 9px/1 Inter, sans-serif; font-style: normal; color: #8d8e96; }
    .mini.active { border-color: #e23b45; box-shadow: inset 0 0 0 1px #e23b45; }
    .picks { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .pick {
      display: flex; align-items: center; gap: 10px; min-height: 40px;
      padding: 0 8px 0 8px; background: #1b1b1f; border-radius: 4px;
    }
    .pick img { width: 26px; height: 26px; object-fit: contain; }
    .pick b { font: 600 13px/1 Inter, sans-serif; }
    .pick span { color: #9b9ca3; font-size: 12px; }
    .pick .install {
      margin-left: auto; height: 28px; padding: 0 10px; border: 0; border-radius: 2px;
      background: #e23b45; color: #fff; font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.04em;
    }
    .pick .install.done { background: #2a2a30; color: #b7b8be; }
    .add {
      display: flex; gap: 8px; margin-top: 10px;
    }
    .add input, .mod-add input {
      height: 36px; flex: 1; border: 0; border-radius: 2px; background: #1b1b1f; padding: 0 12px; font-size: 13px; outline: none;
    }
    .add button, .mod-add button {
      height: 36px; padding: 0 14px; border: 0; border-radius: 2px; background: #e23b45; color: #fff;
      font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.06em;
    }
    .list { margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 44px; padding: 0 12px; background: #1b1b1f; border-radius: 4px; font-size: 13px;
    }
    .item button { border: 0; background: transparent; color: #ff4d57; font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.08em; }
    .side {
      margin: 22px 22px 22px 0; border-radius: 4px; overflow: hidden; position: relative; background: #111; min-height: 280px;
    }
    .side .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 20%, rgba(0,0,0,.82)); }
    .side .info { position: absolute; left: 18px; right: 18px; bottom: 18px; }
    .side .info strong { display: block; margin-top: 6px; font: 600 22px/1.1 Inter, sans-serif; }
    .side .info p { margin: 8px 0 0; color: #d7d8de; font-size: 13px; }
    .mods-wrap { padding: 22px 28px; overflow: auto; }
    .mods-wrap h1 { font-size: 28px; }
    .mod-add { display: flex; gap: 8px; max-width: 560px; margin: 8px 0 16px; }
    .empty { color: #9b9ca3; font-size: 14px; max-width: 460px; }
    .panel { padding: 28px 36px; max-width: 640px; }
    .panel h2 { margin: 0 0 8px; font: 600 28px/1 Inter, sans-serif; }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 52px; border-top: 1px solid #2a2a30; font-size: 14px;
    }
    .row span { color: #c5c6cc; }
    .mem { display: flex; gap: 6px; }
    .mem button, .toggle {
      height: 32px; min-width: 52px; border: 0; border-radius: 2px; background: #1b1b1f; color: #ddd; font: 500 13px/1 Inter, sans-serif;
    }
    .mem button.on, .toggle.on { background: #e23b45; color: #fff; }
    .path {
      height: 32px; min-width: 220px; border-radius: 2px; background: #1b1b1f;
      display: flex; align-items: center; padding: 0 12px; color: #b7b8be; font-size: 13px;
    }
    .rail .pins { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; }
    .rail .pin { position: relative; width: 48px; height: 48px; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: #1b1b1f; }
    .rail .pin img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rail .pin .fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 15px/1 Inter, sans-serif; color: #e8e9ee; }
    .rail .pin.active { box-shadow: 0 0 0 2px #e23b45; }
    .rail .pin:hover { box-shadow: 0 0 0 2px #4a4a55; }
    .rail .pin.active:hover { box-shadow: 0 0 0 2px #e23b45; }
    .rail .pin-limit { color: #5c5d66; font: 500 9px/1 Inter, sans-serif; letter-spacing: 0.06em; }

    .topbar { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; }
    .topbar .chip { height: 34px; display: inline-flex; align-items: center; }
    .topbar .grow { flex: 1; }
    .pill {
      height: 34px; padding: 0 16px; border: 0; border-radius: 2px;
      background: #e23b45; color: #fff; font: 600 13px/1 Inter, sans-serif; letter-spacing: 0.04em;
    }
    .pill:hover { background: #ff4d57; }
    .search { display: flex; gap: 8px; margin: 12px 0 4px; }
    .search input {
      height: 36px; width: 100%; max-width: 320px; border: 1px solid #2c2c32; border-radius: 2px;
      background: #1b1b1f; padding: 0 12px; font-size: 13px; outline: none; color: #f4f5f7;
    }
    .flash { margin: 10px 0 0; color: #ffb4b8; font-size: 13px; }
    .icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 12px; margin-top: 14px; align-items: stretch; }
    .icard {
      border: 1px solid #2c2c32; border-radius: 4px; overflow: hidden; background: #1b1b1f;
      text-align: left; color: #f4f5f7; display: flex; flex-direction: column;
    }
    .icard .cover-wrap { position: relative; flex: none; height: 116px; background: #111; }
    .icard .cover { height: 116px; width: 100%; object-fit: cover; object-position: center 40%; display: block; background: #111; }
    .icard .badge-tag {
      position: absolute; right: 8px; top: 8px; width: 46px; height: 14px;
      object-fit: cover; border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.65);
    }
    .icard .pad { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
    .icard h3 { margin: 0; font: 600 14px/1.2 Inter, sans-serif; overflow-wrap: anywhere; }
    .icard .meta { margin-top: 5px; color: #9b9ca3; font-size: 12px; }
    .icard .row {
      margin-top: auto; padding-top: 10px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .icard .row .mb { font-size: 9px; letter-spacing: 0.03em; }
    .mb {
      width: 100%; height: 28px; padding: 0 4px; border: 1px solid #34343c; border-radius: 2px;
      background: transparent; color: #d7d8de; font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.06em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mb:hover { border-color: #e23b45; color: #fff; }
    .mb.on { background: #e23b45; border-color: #e23b45; color: #fff; }

    .mask { position: fixed; inset: 0; z-index: 40; background: rgba(5,5,7,.74); display: flex; align-items: center; justify-content: center; }
    .modal { width: 860px; max-width: 94vw; max-height: 88vh; display: flex; flex-direction: column; background: #141416; border: 1px solid #2a2a30; border-radius: 4px; }
    .modal > header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid #23232a; }
    .modal > header h2 { margin: 0; font: 600 17px/1 Inter, sans-serif; }
    .modal .x { margin-left: auto; width: 28px; height: 28px; border: 0; background: transparent; color: #9b9ca3; font-size: 15px; }
    .modal .x:hover { background: #2a2a30; color: #fff; }
    .modal .mbody { padding: 16px 20px 20px; overflow: auto; }
    .modal > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #23232a; }
    .btn { height: 34px; padding: 0 14px; border: 0; border-radius: 2px; background: #2a2a30; color: #fff; font: 600 12px/1 Inter, sans-serif; letter-spacing: 0.06em; }
    .btn:hover { background: #34343c; }
    .btn.primary { background: #e23b45; }
    .btn.primary:hover { background: #ff4d57; }
    .btn.ghost { background: transparent; border: 1px solid #34343c; color: #c5c6cc; }
    .field { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 4px; }
    .field > span { color: #9b9ca3; font: 600 11px/1 Inter, sans-serif; letter-spacing: 0.14em; }
    .field input {
      height: 36px; border: 1px solid #2c2c32; border-radius: 2px; background: #1b1b1f;
      padding: 0 12px; font-size: 13px; outline: none; color: #f4f5f7;
    }
    .vbox {
      margin-top: 4px; max-height: 320px; overflow: auto; background: #101013;
      border: 1px solid #23232a; border-radius: 4px; padding: 10px;
    }
    .vbox .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .vbox .vcard { width: 100%; height: 104px; }
    .pick .state {
      margin-left: auto; height: 26px; display: inline-flex; align-items: center; padding: 0 8px;
      border: 1px solid #34343c; border-radius: 2px; color: #9b9ca3;
      font: 600 10px/1 Inter, sans-serif; letter-spacing: 0.06em; white-space: nowrap;
    }
    .pick .state.on { border-color: #2f6b45; color: #7fd18d; }
    .vbox::-webkit-scrollbar { width: 10px; }
    .vbox::-webkit-scrollbar-thumb { background: #2c2c32; border-radius: 5px; }
    .vbox::-webkit-scrollbar-track { background: #101013; }
    .picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
    .picker button { padding: 0; border: 1px solid #2c2c32; border-radius: 3px; overflow: hidden; background: #111; }
    .picker img { width: 100%; height: 62px; object-fit: cover; object-position: center 40%; display: block; }
    .picker button.on { border-color: #e23b45; box-shadow: inset 0 0 0 1px #e23b45; }
    .srv { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; background: #1b1b1f; border-radius: 4px; font-size: 13px; }
    .srv .addr { color: #9b9ca3; }
    .srv .mb { margin-left: auto; }

    .browse { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 0; }
    .browse input {
      height: 36px; width: 260px; border: 1px solid #2c2c32; border-radius: 2px;
      background: #1b1b1f; padding: 0 12px; font-size: 13px; outline: none; color: #f4f5f7;
    }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 10px; margin-top: 14px; }
    .hit { display: flex; gap: 10px; padding: 10px; background: #1b1b1f; border-radius: 4px; }
    .hit img { width: 46px; height: 46px; border-radius: 4px; object-fit: cover; background: #111; flex: none; }
    .hit h4 { margin: 0; font: 600 13px/1.2 Inter, sans-serif; }
    .hit p { margin: 4px 0 0; color: #9b9ca3; font-size: 12px; }
    .hit .mb { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <span>Rus Launcher</span>
      <span class="grow"></span>
      <button class="win" type="button" aria-label="Minimize"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="win close" type="button" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </header>
    <div class="body">
      <aside class="rail">
        <img class="brand" src="brand/mark.png" alt="Rus">
        <div class="pins" id="pins"></div>
        <button class="tab active" type="button" data-view="home" title="Home">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.2 10 3l7 6.2V17a1 1 0 0 1-1 1h-4.2v-5.2H8.2V18H4a1 1 0 0 1-1-1V9.2Z" stroke="currentColor" stroke-width="1.4"/></svg>
          Home
        </button>
        <button class="tab" type="button" data-view="instance" title="Instance">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2.5 17 6.2v7.6L10 17.5 3 13.8V6.2L10 2.5Z" stroke="currentColor" stroke-width="1.4"/><path d="M10 10.2 17 6.2M10 10.2 3 6.2M10 10.2V17.5" stroke="currentColor" stroke-width="1.4"/></svg>
          Instance
        </button>
        <button class="tab" type="button" data-view="mods" title="Mods">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 3h4v3h3v4h-3v3H8v-3H5V6h3V3Z" stroke="currentColor" stroke-width="1.4"/><path d="M12 14h3v3h-3v-3Z" stroke="currentColor" stroke-width="1.4"/></svg>
          Mods
        </button>
        <div class="foot">
          <button class="tab" type="button" data-view="settings" title="Settings">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.8v2.1M10 15.1v2.1M2.8 10h2.1M15.1 10h2.1M4.8 4.8l1.5 1.5M13.7 13.7l1.5 1.5M15.2 4.8l-1.5 1.5M6.3 13.7l-1.5 1.5" stroke="currentColor" stroke-width="1.4"/></svg>
            Settings
          </button>
        </div>
      </aside>
      <main class="main">
        <section class="view" id="home"></section>
        <section class="view hidden" id="instance"></section>
        <section class="view hidden" id="mods"></section>
        <section class="view panel hidden" id="settings">
          <h2>Settings</h2>
          <div class="row"><span>Memory</span><div class="mem" id="mem">
            <button type="button" data-gb="2">2 GB</button>
            <button type="button" class="on" data-gb="4">4 GB</button>
            <button type="button" data-gb="6">6 GB</button>
            <button type="button" data-gb="8">8 GB</button>
          </div></div>
          <div class="row"><span>Game directory</span><div class="path">~/Games/Rus</div></div>
          <div class="row"><span>Language</span><div class="path">English</div></div>
          <div class="row"><span>Skin source</span><div class="mem" id="skin">
            <button type="button" class="on" data-skin="local">Local</button>
            <button type="button" data-skin="microsoft">Microsoft</button>
            <button type="button" data-skin="tlauncher">TLauncher</button>
          </div></div>
          <div class="row"><span>Account</span><div style="display:flex; gap:8px; align-items:center;">
            <span class="path" id="skinAccount">Local skin file</span>
            <button class="mb" id="skinConnect" type="button">CONNECT</button>
          </div></div>
          <div class="row"><span>CurseForge API key</span><div style="display:flex; gap:8px; align-items:center;">
            <span class="path" id="cfKey">Not set</span>
            <button class="mb" id="cfSet" type="button">SET KEY</button>
          </div></div>
          <div class="row"><span>Close launcher when the game starts</span><button class="toggle on" id="closeOnPlay" type="button">On</button></div>
        </section>
      </main>
    </div>
  </div>
  <script>
    const VERSIONS = [
      ["26.3", "Cushion", "26.3_cushion.png", true, "The latest release. Ready to play."],
      ["26.2", "Sulfur Cube", "26.2_sulfur_cube.png", false, "A release just behind the current one."],
      ["26.1", "Chick", "26.1_chick.png", false, "Open this release from the version list."],
      ["1.21.11", "Nautilus", "1.21.11_nautilus.png", true, "Installed for the Creative instance."],
      ["1.21.9", "Copper Golem", "1.21.9_copper_golem.png", false, "An earlier 1.21 release."],
      ["1.21.6", "Happy Ghast", "1.21.6_happy_ghast.png", false, "Keep it for an older world."],
      ["1.21.5", "Firefly Bush", "1.21.5_firefly_bush.png", false, "Not installed on this machine."],
      ["1.21.4", "Creaking", "1.21.4_creaking.png", false, "Not installed on this machine."],
      ["1.21.2", "Bundle", "1.21.2_bundle.png", false, "Not installed on this machine."],
      ["1.21", "Mace", "1.21_mace.png", false, "The first 1.21 release."],
      ["1.20.5", "Wolf Armor", "1.20.5_wolf_armor.png", false, "A 1.20 release."],
      ["1.20.3", "Decorated Pot", "1.20.3_decorated_pot.png", false, "A 1.20 release."],
      ["1.20", "Cherry Grove", "1.20_cherry_grove.png", false, "A 1.20 release."],
      ["1.19", "Warden", "1.19_warden.png", false, "An older release."],
      ["1.18", "Lush Caves", "1.18_lush_caves.png", false, "An older release."],
      ["1.17", "Axolotl", "1.17_axolotl.png", false, "An older release."],
      ["1.16", "Netherite", "1.16_netherite.png", false, "An older release."],
      ["1.15", "Bee", "1.15_bee.png", false, "An older release."],
      ["1.14", "Fox", "1.14_fox.png", true, "Installed for the Legacy instance."],
      ["1.13", "Dolphin", "1.13_dolphin.png", false, "An older release."],
      ["1.12", "Concrete", "1.12_concrete.png", false, "An older release."],
      ["1.11", "Shulker Box", "1.11_shulker_box.png", false, "An older release."],
      ["1.10", "Polar Bear", "1.10_polar_bear.png", false, "An older release."],
      ["1.9", "Elytra", "1.9_elytra.png", false, "An older release."],
      ["1.8", "Slime Block", "1.8_slime_block.png", false, "The oldest release in the list."]
    ].map(([version, name, file, installed, blurb]) => ({ version, name, file, installed, blurb }));

    const LOADERS = ["Vanilla", "Fabric", "Forge", "NeoForge", "Quilt"];
    const TABS = {
      Vanilla: "tabs/vanilla.png",
      Fabric: "tabs/fabric.png",
      Forge: "tabs/forge.png",
      NeoForge: "tabs/neoforge.png",
      Quilt: "tabs/quilt.png"
    };
    const TYPES = [
      ["mod", "Mods"], ["resourcepack", "Resource Packs"],
      ["shader", "Shaders"], ["modpack", "Modpacks"]
    ];
    const CF_CLASS = { mod: 6, resourcepack: 12, shader: 6, modpack: 4471 };

    function tabArt(name) { return TABS[name] || `tabs/${name.toLowerCase()}.png`; }
    function tabPlate(btn, name) {
      if (btn.dataset.fallback) return;
      btn.dataset.fallback = "1";
      const plate = document.createElement("span");
      plate.className = "plate";
      plate.textContent = name;
      btn.textContent = "";
      btn.append(plate);
    }
    const byVersion = Object.fromEntries(VERSIONS.map((v) => [v.version, v]));
    const poster = (file) => "posters/" + file.replace(".png", ".jpg");

    const instances = {
      Survival: { version: "26.3", loader: "Fabric", source: "new", image: null, mods: [], servers: [{ name: "Hypixel", address: "mc.hypixel.net" }] },
      Creative: { version: "1.21.11", loader: "Vanilla", source: "new", image: null, mods: [], servers: [] },
      Legacy: { version: "1.14", loader: "Forge", source: "import", image: null, mods: [], servers: [{ name: "Legacy Realm", address: "play.legacy.net" }] }
    };
    let current = "Survival";
    let view = "home";
    let query = "";
    let pins = ["Survival"];
    const PIN_MAX = 5;
    let flash = "";
    let pane = "advance";
    let family = "1.21";
    let draft = null;
    let skin = { source: "local", account: null };
    let cfKey = "";
    let browse = { source: "modrinth", type: "mod", query: "" };

    function inst() { return instances[current]; }

    /* ---------- shell ---------- */

    function render() {
      renderRail();
      if (view === "home") renderHome();
      if (view === "instance") renderInstance();
      if (view === "mods") renderMods();
    }

    function show(name) {
      view = name;
      for (const id of ["home", "instance", "mods", "settings"]) {
        document.getElementById(id).classList.toggle("hidden", id !== name);
      }
      document.querySelectorAll(".rail .tab").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
      render();
    }

    function renderRail() {
      const box = document.getElementById("pins");
      box.innerHTML = pins.map((name) => {
        const it = instances[name];
        if (!it) return "";
        const v = byVersion[it.version];
        const art = it.image || poster(v.file);
        return `<button class="pin${name === current && view === "instance" ? " active" : ""}" type="button" data-pin="${name}" title="${name}">
          <img src="${art}" alt="${name}" onerror="this.remove()">
          <span class="fb">${name.slice(0, 1).toUpperCase()}</span>
        </button>`;
      }).join("") + (pins.length ? `<span class="pin-limit">${pins.length}/${PIN_MAX}</span>` : "");
    }

    /* ---------- modal helper ---------- */

    let modalEl = null;
    function openModal(opts) {
      closeModal();
      const mask = document.createElement("div");
      mask.className = "mask";
      mask.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
        <header><h2>${opts.title}</h2><button class="x" type="button" aria-label="Close">&#10005;</button></header>
        <div class="mbody">${opts.body || ""}</div>
        ${opts.actions ? "<footer></footer>" : ""}
      </div>`;
      document.body.append(mask);
      modalEl = mask;
      mask.querySelector(".x").addEventListener("click", closeModal);
      mask.addEventListener("click", (e) => { if (e.target === mask) closeModal(); });
      if (opts.actions) {
        const footer = mask.querySelector("footer");
        for (const a of opts.actions) {
          const b = document.createElement("button");
          b.className = "btn " + (a.primary ? "primary" : "ghost");
          b.type = "button";
          b.textContent = a.label;
          b.addEventListener("click", a.onClick);
          footer.append(b);
        }
      }
      return mask;
    }
    function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; draft = null; } }
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    /* ---------- home ---------- */

    function renderHome() {
      const v = byVersion[inst().version];
      const cards = VERSIONS.filter((item) => item.version !== v.version).slice(0, 3);
      document.getElementById("home").innerHTML = `
        <div class="hero">
          <img class="art" src="${poster(v.file)}" alt="${v.name}">
          <div class="shade"></div>
          <div class="copy">
            <p class="kicker">LATEST UPDATE</p>
            <h1>${v.name}</h1>
            <p class="lede">${v.version} is set on ${current}. ${v.installed ? "Installed and ready to play." : "Not installed yet."}</p>
            <button class="play" id="play" type="button">${v.installed ? "PLAY" : "INSTALL"}</button>
          </div>
        </div>
        <div class="feed">
          ${cards.map((item) => `
            <button class="card" type="button" data-version="${item.version}">
              <img class="thumb" src="${poster(item.file)}" alt="">
              <div class="pad">
                <div class="tag">${item.installed ? "INSTALLED" : "UPDATE"}</div>
                <h2>${item.version} ${item.name}</h2>
                <p>${item.blurb}</p>
                <span class="more">READ MORE</span>
              </div>
            </button>`).join("")}
          <button class="game" type="button" data-open="instance">
            <img src="${poster(v.file)}" alt="">
            <div class="veil"></div>
            <div class="label"><span>NOW PLAYING</span><strong>${current}</strong></div>
          </button>
        </div>`;
      document.getElementById("play").addEventListener("click", () => {
        const btn = document.getElementById("play");
        if (!v.installed) { v.installed = true; btn.textContent = "PLAY"; return; }
        btn.textContent = "LAUNCHING";
        setTimeout(() => { btn.textContent = "PLAY"; }, 800);
      });
      document.querySelectorAll("#home .card").forEach((b) => b.addEventListener("click", () => {
        inst().version = b.dataset.version;
        show("instance");
      }));
      document.querySelector("#home .game").addEventListener("click", () => show("instance"));
    }

    /* ---------- versions ---------- */

    function familyOf(version) {
      if (version.startsWith("26.")) return "26";
      const parts = version.split(".");
      return parts.length >= 2 ? parts[0] + "." + parts[1] : version;
    }
    function familyGroups() {
      const map = new Map();
      for (const item of VERSIONS) {
        const key = familyOf(item.version);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return [...map.entries()].map(([key, items]) => ({ key, items, face: items[0] }));
    }
    function loaderTag(loader) {
      return `<img class="tag" src="tabs/${loader.toLowerCase()}@1x.png" alt="${loader}" title="${loader}" onerror="this.style.display='none'">`;
    }

    function familyLabel(g) {
      return g.items.length > 1 ? g.key + ".x" : g.items[0].version;
    }

    function pickRows(items) {
      return `<div class="picks" id="picks">${items.map((item) => `
        <div class="pick" data-pick="${item.version}">
          <img src="icons/${item.file}" alt="">
          <b>${item.version}</b>
          <span>${item.name}</span>
          <span class="state${item.installed ? " on" : ""}">${item.installed ? "INSTALLED" : "DOWNLOADS ON LAUNCH"}</span>
        </div>`).join("")}</div>`;
    }

    function loaderStrip(loader) {
      return LOADERS.map((name) => `<button type="button" class="${name === loader ? "active" : ""}" data-loader="${name}" title="${name}" aria-label="${name}"><img src="${tabArt(name)}" alt="${name}" onerror="tabPlate(this.closest('[data-loader]'), '${name}')"></button>`).join("");
    }

    /* ---------- instance page ---------- */

    function cardHTML(name) {
      const it = instances[name];
      const v = byVersion[it.version];
      const img = it.image || poster(v.file);
      const pinned = pins.includes(name);
      return `<div class="icard">
        <div class="cover-wrap">
          <img class="cover" src="${img}" alt="">
          <img class="badge-tag" src="tabs/${it.loader.toLowerCase()}@1x.png" alt="${it.loader}" title="${it.loader}" onerror="this.style.display='none'">
        </div>
        <div class="pad">
          <h3>${name}</h3>
          <div class="meta">${it.version}${it.source === "import" ? " · imported" : ""}</div>
          <div class="row">
            <button class="mb${name === current ? " on" : ""}" type="button" data-act="open" data-name="${name}">OPEN</button>
            <button class="mb" type="button" data-act="rename" data-name="${name}">RENAME</button>
            <button class="mb" type="button" data-act="image" data-name="${name}">IMAGE</button>
            <button class="mb" type="button" data-act="duplicate" data-name="${name}">DUPLICATE</button>
            <button class="mb" type="button" data-act="servers" data-name="${name}">SERVERS</button>
            <button class="mb${pinned ? " on" : ""}" type="button" data-act="pin" data-name="${name}">${pinned ? "PINNED" : "PIN"}</button>
          </div>
        </div>
      </div>`;
    }

    function renderInstance() {
      const names = Object.keys(instances).filter((n) => n.toLowerCase().includes(query.toLowerCase()));
      const data = inst();
      const v = byVersion[data.version];
      document.getElementById("instance").innerHTML = `
        <div class="page">
          <div class="form">
            <h1>Instance</h1>
            <p class="note">Installed clients on this machine. Everything about adding a version lives in New +.</p>
            <div class="topbar">
              <span class="chip active">Installed</span>
              <span class="grow"></span>
              <button class="pill" id="newBtn" type="button">New +</button>
            </div>
            <div class="search">
              <input id="q" type="text" placeholder="Search installed instances" aria-label="Search instances" value="${query}">
            </div>
            ${flash ? `<p class="flash">${flash}</p>` : ""}
            <div class="icards" id="icards">
              ${names.map(cardHTML).join("") || `<p class="empty">No instance matches “${query}”.</p>`}
            </div>
          </div>
          <aside class="side">
            <img class="side-art" src="${data.image || poster(v.file)}" alt="">
            <div class="veil"></div>
            <div class="info">
              <div class="kicker">${data.loader}</div>
              <img class="badge-tag" style="position:static; margin: 8px 0 0;" src="tabs/${data.loader.toLowerCase()}@1x.png" alt="${data.loader}" onerror="this.style.display='none'">
              <strong>${current}</strong>
              <p>${data.version} · ${data.source === "import" ? "Imported" : "New"} · ${data.mods.length} mods · ${data.servers.length} servers</p>
              <button class="save" id="saveInst" type="button">SAVE</button>
            </div>
          </aside>
        </div>`;
      document.getElementById("newBtn").addEventListener("click", openNewModal);
      const q = document.getElementById("q");
      q.addEventListener("input", () => { query = q.value; flash = ""; const pos = q.selectionStart; renderInstance(); const el = document.getElementById("q"); el.focus(); el.setSelectionRange(pos, pos); });
      document.getElementById("saveInst").addEventListener("click", () => {
        const btn = document.getElementById("saveInst");
        btn.textContent = "SAVED";
        setTimeout(() => { btn.textContent = "SAVE"; }, 800);
      });
      const grid = document.getElementById("icards");
      grid.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const name = btn.dataset.name;
        if (btn.dataset.act === "open") { current = name; show("instance"); }
        if (btn.dataset.act === "rename") openRename(name);
        if (btn.dataset.act === "image") openImage(name);
        if (btn.dataset.act === "servers") openServers(name);
        if (btn.dataset.act === "duplicate") duplicate(name);
        if (btn.dataset.act === "pin") togglePin(name);
      });
    }

    /* ---------- instance actions ---------- */

    function duplicate(name) {
      let copy = "Copy of " + name;
      let i = 2;
      while (instances[copy]) { copy = "Copy of " + name + " " + i++; }
      const src = instances[name];
      instances[copy] = {
        version: src.version, loader: src.loader, source: src.source,
        image: src.image, mods: [...src.mods], servers: src.servers.map((s) => ({ ...s }))
      };
      current = copy;
      flash = `${name} duplicated as ${copy}.`;
      render();
    }

    function togglePin(name) {
      const at = pins.indexOf(name);
      if (at >= 0) { pins.splice(at, 1); flash = `${name} unpinned.`; }
      else if (pins.length >= PIN_MAX) { flash = `The rail holds ${PIN_MAX} pins. Unpin one first.`; }
      else { pins.push(name); flash = `${name} pinned to the rail.`; }
      render();
    }

    function openRename(name) {
      const mask = openModal({
        title: "Rename instance",
        body: `<div class="field"><span>NAME</span><input id="rn" type="text" value="${name}" aria-label="Instance name"></div>`,
        actions: [
          { label: "CANCEL", onClick: closeModal },
          {
            label: "RENAME", primary: true, onClick: () => {
              const next = mask.querySelector("#rn").value.trim();
              if (!next || next === name) { closeModal(); return; }
              const old = instances[name];
              delete instances[name];
              instances[next] = old;
              const at = pins.indexOf(name);
              if (at >= 0) pins[at] = next;
              if (current === name) current = next;
              flash = `${name} renamed to ${next}.`;
              closeModal();
              render();
            }
          }
        ]
      });
      const input = mask.querySelector("#rn");
      input.focus();
      input.setSelectionRange(0, input.value.length);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") mask.querySelector(".btn.primary").click(); });
    }

    function openImage(name) {
      const it = instances[name];
      const art = VERSIONS.map((v) => `<button type="button" data-img="${poster(v.file)}" class="${it.image === poster(v.file) ? "on" : ""}"><img src="${poster(v.file)}" alt="${v.version}"></button>`).join("");
      const mask = openModal({
        title: `Card image · ${name}`,
        body: `<p class="note">Pick an update poster, or paste a path or URL to your own PNG.</p>
          <div class="picker">${art}</div>
          <div class="field"><span>CUSTOM PNG PATH OR URL</span><input id="imgPath" type="text" placeholder="~/Games/Rus/cover.png" value="${it.image || ""}" aria-label="Image path"></div>`,
        actions: [
          { label: "RESET", onClick: () => { it.image = null; flash = `${name} uses the default art again.`; closeModal(); render(); } },
          { label: "CANCEL", onClick: closeModal },
          {
            label: "APPLY", primary: true, onClick: () => {
              const val = mask.querySelector("#imgPath").value.trim();
              it.image = val || null;
              flash = val ? `${name} uses ${val}.` : `${name} uses the default art again.`;
              closeModal();
              render();
            }
          }
        ]
      });
      mask.querySelector(".picker").addEventListener("click", (e) => {
        const b = e.target.closest("[data-img]");
        if (!b) return;
        it.image = b.dataset.img;
        flash = `${name} card image set.`;
        closeModal();
        render();
      });
    }

    function openServers(name) {
      const it = instances[name];
      const mask = openModal({
        title: `Servers · ${name}`,
        body: `<div id="srvBody">${serverList(it)}</div>
          <div class="field"><span>ADD A SERVER</span></div>
          <div class="add">
            <input id="srvName" type="text" placeholder="Name" aria-label="Server name">
            <input id="srvAddr" type="text" placeholder="Address" aria-label="Server address">
            <button type="button" id="srvAdd">ADD</button>
          </div>`,
        actions: [{ label: "DONE", primary: true, onClick: () => { closeModal(); render(); } }]
      });
      const body = mask.querySelector("#srvBody");
      body.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-rm]");
        if (!btn) return;
        it.servers.splice(Number(btn.dataset.rm), 1);
        body.innerHTML = serverList(it);
      });
      mask.querySelector("#srvAdd").addEventListener("click", () => {
        const n = mask.querySelector("#srvName").value.trim();
        const a = mask.querySelector("#srvAddr").value.trim();
        if (!n || !a) return;
        it.servers.push({ name: n, address: a });
        mask.querySelector("#srvName").value = "";
        mask.querySelector("#srvAddr").value = "";
        body.innerHTML = serverList(it);
      });
    }
    function serverList(it) {
      if (!it.servers.length) return `<p class="empty">No servers yet.</p>`;
      return `<div class="list">${it.servers.map((s, i) => `
        <div class="srv"><span>${s.name}</span><span class="addr">${s.address}</span>
        <button class="mb" type="button" data-rm="${i}">REMOVE</button></div>`).join("")}</div>`;
    }

    /* ---------- new instance (popup) ---------- */

    function openNewModal() {
      draft = { name: "Client " + (Object.keys(instances).length + 1), mode: "new", folder: "~/Games/Rus/import", loader: "Fabric", version: "26.3", family: "1.21" };
      const mask = openModal({
        title: "New instance",
        body: `<div id="draftBody"></div>`,
        actions: [
          { label: "CANCEL", onClick: closeModal },
          {
            label: "CREATE", primary: true, onClick: () => {
              const nm = (mask.querySelector("#draftName") || {}).value || draft.name;
              let name = String(nm).trim() || draft.name;
              let i = 2;
              while (instances[name]) { name = String(nm).trim() + " " + i++; }
              instances[name] = { version: draft.version, loader: draft.loader, source: draft.mode === "import" ? "import" : "new", image: null, mods: [], servers: [] };
              current = name;
              flash = `${name} created on ${draft.loader} ${draft.version}.`;
              closeModal();
              render();
            }
          }
        ]
      });
      paintDraft();
    }

    function paintDraft() {
      const box = document.getElementById("draftBody");
      const groups = familyGroups();
      const open = groups.find((g) => g.key === draft.family) || groups[0];
      const picks = open.items;
      box.innerHTML = `
        <div class="subtabs" id="modeTabs">
          <button type="button" data-mode="new" class="${draft.mode === "new" ? "active" : ""}">New</button>
          <button type="button" data-mode="import" class="${draft.mode === "import" ? "active" : ""}">Import</button>
        </div>
        <div class="field"><span>NAME</span><input id="draftName" type="text" value="${draft.name}" aria-label="Instance name"></div>
        ${draft.mode === "import" ? `<div class="field"><span>FOLDER</span><input id="draftFolder" type="text" value="${draft.folder}" aria-label="Folder"></div>` : ""}
        <div class="label">LOADER</div>
        <div class="ltabs" id="draftLoaders">${loaderStrip(draft.loader)}</div>
        <div class="vbox">
        <div class="cards" id="draftFamilies">
          ${groups.map((g) => `<button class="vcard${g.key === open.key ? " active" : ""}" type="button" data-family="${g.key}">
            <img class="art" src="${poster(g.face.file)}" alt=""><span class="scrim"></span>
            <span class="head"><img src="icons/${g.face.file}" alt=""><b>${familyLabel(g)}</b>${loaderTag(draft.loader)}</span>
          </button>`).join("")}
        </div>
        <div class="label">${open.key} RELEASES</div>
        ${pickRows(picks)}
        </div>
        <p class="note">Creating <b>${draft.name}</b> on <b>${draft.loader}</b> with <b>${draft.version}</b>.${
          byVersion[draft.version] && !byVersion[draft.version].installed ? " That version downloads on the first launch." : ""
        }</p>`;
      wireDraft(box);
    }

    function wireDraft(box) {
      box.querySelector("#modeTabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-mode]");
        if (!b) return;
        draft.mode = b.dataset.mode;
        paintDraft();
      });
      box.querySelector("#draftLoaders").addEventListener("click", (e) => {
        const b = e.target.closest("[data-loader]");
        if (!b) return;
        draft.loader = b.dataset.loader;
        paintDraft();
      });
      const fams = box.querySelector("#draftFamilies");
      if (fams) fams.addEventListener("click", (e) => {
        const b = e.target.closest("[data-family]");
        if (!b) return;
        draft.family = b.dataset.family;
        paintDraft();
      });
      const picks = box.querySelector("#picks");
      if (picks) picks.addEventListener("click", (e) => {
        const row = e.target.closest("[data-pick]");
        if (!row) return;
        draft.version = row.dataset.pick;
        paintDraft();
      });
      const nameField = box.querySelector("#draftName");
      if (nameField) nameField.addEventListener("input", () => { draft.name = nameField.value; });
      const folderField = box.querySelector("#draftFolder");
      if (folderField) folderField.addEventListener("input", () => { draft.folder = folderField.value; });
    }

    /* ---------- mods ---------- */

    async function runSearch() {
      const box = document.getElementById("results");
      const status = document.getElementById("bstatus");
      if (!box) return;
      status.innerHTML = `<p class="empty">Loading…</p>`;
      box.innerHTML = "";
      const loader = inst().loader.toLowerCase();
      if (browse.source === "curseforge") {
        if (!cfKey) {
          status.innerHTML = `<p class="empty">CurseForge needs an API key. Add it in Settings → CurseForge API key.</p>`;
          return;
        }
        try {
          const url = `https://api.curseforge.com/v1/mods/search?gameId=432&classId=${CF_CLASS[browse.type]}&searchFilter=${encodeURIComponent(browse.query)}&pageSize=12`;
          const res = await fetch(url, { headers: { "x-api-key": cfKey } });
          const json = await res.json();
          browse.results = (json.data || []).map((m) => ({
            title: m.name, description: m.summary, icon: m.logo && m.logo.thumbnailUrl, downloads: m.downloadCount
          }));
        } catch (err) {
          status.innerHTML = `<p class="empty">CurseForge blocked the browser call. That API needs a small proxy or a desktop client.</p>`;
          return;
        }
      } else {
        const facets = [["project_type:" + browse.type]];
        if (browse.type !== "resourcepack" && browse.type !== "shader" && loader !== "vanilla") facets.push(["categories:" + loader]);
        try {
          const url = `https://api.modrinth.com/v2/search?query=${encodeURIComponent(browse.query)}&facets=${encodeURIComponent(JSON.stringify(facets))}&limit=12`;
          const res = await fetch(url);
          const json = await res.json();
          browse.results = (json.hits || []).map((h) => ({
            title: h.title, description: h.description, icon: h.icon_url, downloads: h.downloads
          }));
        } catch (err) {
          status.innerHTML = `<p class="empty">Modrinth could not be reached. Check the connection and try again.</p>`;
          return;
        }
      }
      paintResults();
    }

    function paintResults() {
      const box = document.getElementById("results");
      const status = document.getElementById("bstatus");
      if (!box) return;
      status.innerHTML = "";
      if (!browse.results.length) { box.innerHTML = `<p class="empty">No results.</p>`; return; }
      box.innerHTML = browse.results.map((h) => `
        <div class="hit">
          <img src="${h.icon || "brand/mark.png"}" alt="">
          <div>
            <h4>${h.title}</h4>
            <p>${(h.description || "").slice(0, 120)}</p>
            <p class="addr">${(h.downloads || 0).toLocaleString("en-US")} downloads</p>
            <button class="mb" type="button" data-add="${encodeURIComponent(h.title)}">ADD</button>
          </div>
        </div>`).join("");
      box.addEventListener("click", (e) => {
        const b = e.target.closest("[data-add]");
        if (!b) return;
        const name = decodeURIComponent(b.dataset.add);
        if (!inst().mods.includes(name)) inst().mods.push(name);
        b.textContent = "ADDED";
        b.classList.add("on");
        renderModsList();
      });
    }

    function renderModsList() {
      const list = document.getElementById("modList");
      if (!list) return;
      const data = inst();
      list.innerHTML = data.mods.map((name, i) => `<div class="item"><span>${name}</span><button type="button" data-i="${i}">REMOVE</button></div>`).join("")
        || `<p class="empty">No mods yet.</p>`;
      list.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        data.mods.splice(Number(b.dataset.i), 1);
        renderModsList();
      }));
    }

    function renderMods() {
      const data = inst();
      const v = byVersion[data.version];
      document.getElementById("mods").innerHTML = `
        <div class="mods-wrap">
          <p class="kicker">MODS</p>
          <h1>${current}</h1>
          <p class="note">${v.version} · ${data.loader}${data.source === "import" ? " · Imported" : ""}</p>
          <div class="browse">
            <input id="bq" type="text" placeholder="Search for content" aria-label="Search" value="${browse.query}">
            <div class="chips" id="srcTabs">
              <button class="chip${browse.source === "modrinth" ? " active" : ""}" type="button" data-src="modrinth">Modrinth</button>
              <button class="chip${browse.source === "curseforge" ? " active" : ""}" type="button" data-src="curseforge">CurseForge</button>
            </div>
            <div class="chips" id="typeTabs">
              ${TYPES.map(([key, label]) => `<button class="chip${browse.type === key ? " active" : ""}" type="button" data-type="${key}">${label}</button>`).join("")}
            </div>
            <button class="btn primary" id="doSearch" type="button">SEARCH</button>
          </div>
          <div id="bstatus"></div>
          <div class="results" id="results"></div>
          <div class="label">INSTALLED ON ${current.toUpperCase()}</div>
          <div class="list" id="modList"></div>
        </div>`;
      document.getElementById("bq").addEventListener("input", (e) => { browse.query = e.target.value; });
      document.getElementById("bq").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
      document.getElementById("doSearch").addEventListener("click", runSearch);
      document.getElementById("srcTabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-src]");
        if (!b) return;
        browse.source = b.dataset.src;
        browse.results = [];
        renderMods();
      });
      document.getElementById("typeTabs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-type]");
        if (!b) return;
        browse.type = b.dataset.type;
        browse.results = [];
        renderMods();
      });
      renderModsList();
    }

    /* ---------- skin + keys ---------- */

    const SKIN_LABEL = { local: "Local skin file", microsoft: "Microsoft account", tlauncher: "TLauncher account" };
    function paintSkin() {
      document.querySelectorAll("#skin button").forEach((b) => b.classList.toggle("on", b.dataset.skin === skin.source));
      document.getElementById("skinAccount").textContent = skin.account ? `Connected as ${skin.account}` : SKIN_LABEL[skin.source];
      const btn = document.getElementById("skinConnect");
      btn.style.visibility = skin.source === "local" ? "hidden" : "visible";
      btn.textContent = skin.account ? "DISCONNECT" : "CONNECT";
    }
    document.getElementById("skin").addEventListener("click", (e) => {
      const b = e.target.closest("[data-skin]");
      if (!b) return;
      skin.source = b.dataset.skin;
      skin.account = null;
      paintSkin();
    });
    document.getElementById("skinConnect").addEventListener("click", () => {
      if (skin.account) { skin.account = null; }
      else {
        const who = skin.source === "microsoft" ? "Obsifox" : "Obsifox_TL";
        skin.account = who;
      }
      paintSkin();
    });
    document.getElementById("cfSet").addEventListener("click", () => {
      const mask = openModal({
        title: "CurseForge API key",
        body: `<p class="note">Paste the key from console.curseforge.com. It is kept for this session only.</p>
          <div class="field"><span>API KEY</span><input id="cfInput" type="text" value="${cfKey}" aria-label="API key"></div>`,
        actions: [
          { label: "CLEAR", onClick: () => { cfKey = ""; document.getElementById("cfKey").textContent = "Not set"; closeModal(); } },
          { label: "CANCEL", onClick: closeModal },
          {
            label: "SAVE", primary: true, onClick: () => {
              cfKey = mask.querySelector("#cfInput").value.trim();
              document.getElementById("cfKey").textContent = cfKey ? "Key saved" : "Not set";
              closeModal();
            }
          }
        ]
      });
    });

    /* ---------- shell wiring ---------- */

    document.querySelector(".rail").addEventListener("click", (e) => {
      const pin = e.target.closest("[data-pin]");
      if (pin) {
        current = pin.dataset.pin;
        if (!instances[current]) return;
        show("instance");
        return;
      }
      const btn = e.target.closest(".tab");
      if (!btn) return;
      show(btn.dataset.view);
    });
    document.getElementById("mem").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      document.querySelectorAll("#mem button").forEach((b) => b.classList.remove("on"));
      btn.classList.add("on");
    });
    document.getElementById("closeOnPlay").addEventListener("click", (e) => {
      const on = e.currentTarget.classList.toggle("on");
      e.currentTarget.textContent = on ? "On" : "Off";
    });
    paintSkin();
    show("instance");
  </script>
</body>
</html>

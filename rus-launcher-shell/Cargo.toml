[package]
name = "rus-launcher-shell"
version = "0.1.0"
edition = "2021"
description = "Rus Launcher. Serves the interface and opens it in a window of its own."
publish = false

[dependencies]
include_dir = "0.7"
tao = { version = "0.37", optional = true }
wry = { version = "0.57.1", optional = true }

[features]
default = ["native"]
native = ["wry", "tao"]
tao = ["dep:tao"]

[[bin]]
name = "rus-launcher-shell"
path = "src/main.rs"
